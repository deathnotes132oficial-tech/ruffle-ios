# Compila o app de iPhone, ASSINA e manda pro TestFlight.
#
# POR QUE ISTO EXISTE
# -------------------
# Aplicativo de iPhone so se compila em Mac, e nos nao temos um. O GitHub
# empresta Macs de graca pra projetos publicos: a maquina e deles, o trabalho e
# automatico, e o resultado vai direto pro TestFlight, de onde o testador
# instala no aparelho dele.
#
# O QUE PRECISA ESTAR PRONTO ANTES (uma vez so)
#   - os tres segredos no repositorio: APPLE_KEY_ID, APPLE_ISSUER_ID, APPLE_P8
#   - o identificador registrado no painel da Apple (BUNDLE abaixo)
#   - o app criado no App Store Connect, apontando pra esse identificador
#
# O QUE ISTO NAO RESPONDE
# -----------------------
# Velocidade. So o aparelho de verdade responde isso — e e justamente pra isso
# que o app vai pro TestFlight.

name: Mandar pro TestFlight

# So roda quando voce mandar, pelo botao. Nada acontece sozinho.
on:
  workflow_dispatch:

env:
  # O endereco do app na Apple. NAO PODE MUDAR depois do primeiro envio.
  BUNDLE: com.deathnotestore.cfclient
  # O numero do time, do painel da Apple. Nao e segredo: ele aparece dentro de
  # qualquer app publicado.
  TIME: HUJNSQWP3K

jobs:
  enviar:
    runs-on: macos-latest

    steps:
      - name: Pegar o codigo
        uses: actions/checkout@v4

      - name: Mostrar as ferramentas da maquina
        run: |
          xcodebuild -version
          rustc --version || echo "(sem rust ainda)"

      # SEM mandar trocar de versao do Rust.
      #
      # O projeto tem um rust-toolchain.toml que fixa a versao que ele quer.
      # Numa tentativa anterior eu mandei usar a estavel e o alvo foi instalado
      # na versao errada. Rodando dentro da pasta do projeto, o rustup respeita
      # o arquivo dele sozinho.
      - name: Instalar o alvo de iPhone
        run: |
          rustup show
          rustup target add aarch64-apple-ios
          rustup target list --installed

      - name: Descobrir o nome do projeto
        id: achar
        run: |
          set -e
          PROJETO=$(ls -d *.xcodeproj | head -1)
          ESQUEMA=$(xcodebuild -list -project "$PROJETO" -json \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['project']['schemes'][0])")
          echo "projeto: $PROJETO / esquema: $ESQUEMA"
          echo "projeto=$PROJETO" >> $GITHUB_OUTPUT
          echo "esquema=$ESQUEMA" >> $GITHUB_OUTPUT

      # A CHAVE DA APPLE, no lugar onde as ferramentas dela procuram.
      #
      # Tanto o xcodebuild quanto o enviador olham em ~/.appstoreconnect, e o
      # nome do arquivo precisa ser AuthKey_<id da chave>.p8 — e assim que eles
      # sabem qual chave e qual.
      - name: Preparar a chave da Apple
        env:
          P8: ${{ secrets.APPLE_P8 }}
          ID_CHAVE: ${{ secrets.APPLE_KEY_ID }}
        run: |
          set -e
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$P8" > ~/.appstoreconnect/private_keys/AuthKey_$ID_CHAVE.p8
          # Nunca mostrar o conteudo: so conferir que chegou inteiro.
          wc -c < ~/.appstoreconnect/private_keys/AuthKey_$ID_CHAVE.p8

      # COMPILAR SEM ASSINAR. A ASSINATURA FICA TODA PRO EMPACOTAMENTO.
      #
      # Duas tentativas anteriores esbarraram em comportamentos opostos do
      # Xcode, e nenhuma tem saida por ajuste fino:
      #
      #   - so assinatura automatica: pra COMPILAR ele quer um perfil de
      #     DESENVOLVIMENTO, que serve pra instalar em aparelhos conhecidos —
      #     e a Apple exige pelo menos um aparelho cadastrado. Erro: "your team
      #     has no devices from which to generate a provisioning profile". Nao
      #     temos aparelho, e nao precisamos: quem instala e o TestFlight.
      #   - automatica MAIS a identidade de distribuicao na mao: "conflicting
      #     provisioning settings", porque sao duas ordens diferentes sobre a
      #     mesma coisa.
      #
      # A saida e nao assinar agora. O passo seguinte empacota e assina, e la o
      # alvo e declaradamente a App Store: o Xcode cria o perfil de
      # DISTRIBUICAO, que nao precisa de aparelho nenhum, e nao ha conflito
      # porque existe uma unica decisao de assinatura no caminho todo. Compilar
      # sem assinar ja era o que o robo antigo fazia, e funcionava.
      #
      # O NUMERO DA COMPILACAO vem do contador do GitHub. O TestFlight recusa
      # numero repetido, e o do projeto e fixo: sem isto, o segundo envio
      # falharia com "ja existe uma compilacao com esse numero".
      #
      # CODE_SIGN_ENTITLEMENTS VAZIO: o ruffle-ios.entitlements do projeto pede
      # permissoes que so existem no macOS (app-sandbox, arquivos, rede). No
      # iPhone elas nao existem e derrubam a assinatura. No iOS o acesso a rede
      # ja e livre, entao nao se perde nada.
      #
      # A TELA DEITADA: o projeto tem GENERATE_INFOPLIST_FILE = YES, e nesse
      # modo o Xcode MISTURA as configuracoes INFOPLIST_KEY_* por cima do
      # Info.plist — a lista "so deitado" do arquivo era sobrescrita pela do
      # projeto, que permite em pe. A tentativa anterior usou a chave SEM o
      # sufixo _iPhone, que e outra chave e nao vale no iPhone.
      #
      #
      # IPHONEOS_DEPLOYMENT_TARGET=15.0: o projeto pede iOS 13, e a Apple
      # avisa no envio que a partir de 2027 o minimo sera 15. Hoje e so
      # aviso; subir agora evita ter que voltar aqui depois.
      # SO IPHONE (TARGETED_DEVICE_FAMILY=1): o projeto vem marcado tambem pra
      # iPad e visor, e app de iPad que aceita uma orientacao so e recusado na
      # conferencia da Apple.
      - name: Compilar
        run: |
          set -o pipefail
          xcodebuild \
            -project "${{ steps.achar.outputs.projeto }}" \
            -scheme "${{ steps.achar.outputs.esquema }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath construcao/app.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGN_ENTITLEMENTS= \
            PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE \
            MARKETING_VERSION=1.0 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            TARGETED_DEVICE_FAMILY=1 \
            INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone="UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight" \
            INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad="UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight" \
            INFOPLIST_KEY_ITSAppUsesNonExemptEncryption=NO \
            archive

      # AQUI O APP E ASSINADO, uma vez so, pra App Store.
      #
      # "signingStyle automatic" mais a chave da Apple: o Xcode cria no painel
      # o certificado e o perfil de distribuicao que faltarem.
      #
      # UMA TENTATIVA SO.
      #
      # Antes isto tentava "app-store-connect" e, se falhasse, repetia com o
      # nome antigo "app-store". Parecia prudente, mas escondia o problema: o
      # erro que sobrava no fim era o da SEGUNDA tentativa, e a causa de
      # verdade (permissao da chave) ficava enterrada na primeira. Uma
      # tentativa so, e o erro que aparece e o que importa.
      - name: Assinar e empacotar o .ipa
        env:
          ID_CHAVE: ${{ secrets.APPLE_KEY_ID }}
          ID_EMISSOR: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          set -e
          empacotar () {
            cat > instrucoes.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$1</string>
            <key>teamID</key><string>$TIME</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><false/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
            xcodebuild -exportArchive \
              -archivePath construcao/app.xcarchive \
              -exportOptionsPlist instrucoes.plist \
              -exportPath saida \
              -allowProvisioningUpdates \
              -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$ID_CHAVE.p8 \
              -authenticationKeyID "$ID_CHAVE" \
              -authenticationKeyIssuerID "$ID_EMISSOR"
          }
          empacotar app-store-connect
          ls -lh saida/*.ipa

      - name: Mandar pro TestFlight
        env:
          ID_CHAVE: ${{ secrets.APPLE_KEY_ID }}
          ID_EMISSOR: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          set -e
          ARQUIVO=$(ls saida/*.ipa | head -1)
          echo "enviando: $ARQUIVO"
          xcrun altool --upload-app -f "$ARQUIVO" -t ios \
            --apiKey "$ID_CHAVE" --apiIssuer "$ID_EMISSOR"
          echo ""
          echo "Enviado. O TestFlight ainda processa o arquivo por alguns"
          echo "minutos antes de liberar pro testador."

      # Guardado tambem aqui: se o envio falhar por algo do lado da Apple, o
      # arquivo pronto fica pra baixar, e nao se perde a compilacao inteira.
      - name: Guardar o .ipa pra baixar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-de-iphone
          path: saida/*.ipa
          if-no-files-found: warn
