# Abre o aplicativo num iPhone simulado, manda ele abrir um Flash, e
# fotografa a tela.
#
# POR QUE ISTO EXISTE
# -------------------
# O montar.yml respondeu "compila?". A primeira versao disto respondeu
# "abre?" — e a resposta foi sim: apareceu a tela do Ruffle, de pe por 30
# segundos.
#
# Agora falta a pergunta seguinte: ele DESENHA FLASH, ou so tem a casca?
# Entao a gente poe um arquivo .swf na maquina e manda o aplicativo abrir.
#
# O QUE ISTO NAO RESPONDE
# -----------------------
# Velocidade. O simulador usa o processador do Mac deles, muito mais forte
# que o de um iPhone. Serve pra saber se FUNCIONA, nunca se e rapido. Essa
# resposta so vem no aparelho de verdade, pelo TestFlight.

name: Rodar no simulador

on:
  workflow_dispatch:
    inputs:
      swf:
        description: "Endereco do jogo (em branco = abre na tela de entrada, que e o teste normal)"
        required: false
        default: ""

jobs:
  simulador:
    runs-on: macos-latest

    steps:
      - name: Pegar o codigo
        uses: actions/checkout@v4

      # SEM mandar trocar de versao do Rust.
      #
      # O projeto tem um rust-toolchain.toml que fixa a versao que ele quer.
      # Numa tentativa anterior eu mandei usar a estavel, e o alvo do simulador
      # foi instalado na versao errada. Rodando DENTRO da pasta do projeto, o
      # rustup respeita o arquivo dele sozinho.
      - name: Instalar o alvo de simulador
        run: |
          rustup show
          rustup target add aarch64-apple-ios-sim
          rustup target list --installed

      - name: Descobrir o nome do projeto
        id: achar
        run: |
          set -e
          PROJETO=$(ls -d *.xcodeproj | head -1)
          ESQUEMA=$(xcodebuild -list -project "$PROJETO" -json \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['project']['schemes'][0])")
          echo "projeto=$PROJETO" >> $GITHUB_OUTPUT
          echo "esquema=$ESQUEMA" >> $GITHUB_OUTPUT
          echo "projeto: $PROJETO / esquema: $ESQUEMA"

      # ARCHS=arm64 existe porque por padrao ele tenta montar um aplicativo que
      # sirva em simulador Intel E Apple ao mesmo tempo. O pedaco Intel nem
      # existe no Rust com esse nome, e a maquina do GitHub e Apple.
      #
      # RELEASE, e nao Debug. Em Debug o Ruffle carrega conferencias internas
      # que derrubam o programa inteiro ao primeiro texto estranho — foi o que
      # matou o teste anterior ("assertion failed: ch <= 0x10FFFF"), e o
      # DDTank manda texto chines o tempo todo. Essas conferencias nao existem
      # no aplicativo de verdade, entao testar em Debug media a coisa errada.
      # Custo: compila mais devagar.
      - name: Compilar para o simulador
        run: |
          set -o pipefail
          xcodebuild \
            -project "${{ steps.achar.outputs.projeto }}" \
            -scheme "${{ steps.achar.outputs.esquema }}" \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath construcao \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            INFOPLIST_KEY_CFBundleDisplayName="CF Client" \
            INFOPLIST_KEY_UISupportedInterfaceOrientations="UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight" \
            build

      # USAR UM IPHONE QUE JA EXISTE, em vez de criar.
      #
      # Criar escolhendo "o ultimo da lista" saiu um iPhone 6s Plus, que nao
      # roda iOS 26 — "Incompatible device". Os que ja vem na maquina sao
      # compativeis com o Xcode dela.
      - name: Ligar um iPhone simulado
        id: telefone
        run: |
          set -e
          echo "--- aparelhos prontos nesta maquina:"
          xcrun simctl list devices available | grep -i iphone || true
          ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for v in d.values() for x in v if 'iPhone' in x['name']]; print(c[-1]['udid'] if c else '')")
          NOME=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for v in d.values() for x in v if 'iPhone' in x['name']]; print(c[-1]['name'] if c else '')")
          if [ -z "$ID" ]; then
            echo "Nenhum iPhone pronto. Nao da pra seguir."
            exit 1
          fi
          echo "usando: $NOME ($ID)"
          xcrun simctl boot "$ID" || true
          xcrun simctl bootstatus "$ID" -b
          echo "id=$ID" >> $GITHUB_OUTPUT

      - name: Instalar e abrir o aplicativo
        id: abrir
        run: |
          set -e
          APLICATIVO=$(find construcao/Build/Products -maxdepth 3 -name '*.app' | head -1)
          echo "aplicativo: $APLICATIVO"
          NOME=$(defaults read "$PWD/$APLICATIVO/Info" CFBundleIdentifier)
          echo "identificador: $NOME"
          # O QUE FOI PARAR DENTRO DO APLICATIVO.
          #
          # O arquivo de configuracao no projeto diz uma coisa e o aplicativo
          # se comporta de outra. Em vez de supor qual manda, imprimimos o que
          # ficou dentro do produto final.
          echo "--- orientacao e esquema no aplicativo construido:"
          plutil -p "$APLICATIVO/Info.plist" | grep -iE "orientation|URLScheme|URLName" || echo "(nao achei nada disso)"
          xcrun simctl install "${{ steps.telefone.outputs.id }}" "$APLICATIVO"
          mkdir -p fotos
          echo "nome=$NOME" >> $GITHUB_OUTPUT

      # ENTREGAR O ENDERECO, nao baixar o arquivo.
      #
      # Antes a gente baixava um .swf e entregava o arquivo. Agora o
      # aplicativo aceita o endereco do jogo inteiro, com usuario e chave, e
      # busca sozinho — que e como ele vai funcionar na mao do jogador.
      #
      # Em branco, usa um Flash de teste do proprio projeto Ruffle, so pra
      # conferir que a entrega funciona.
      - name: Mandar o aplicativo abrir
        run: |
          set +e
          ID="${{ steps.telefone.outputs.id }}"
          ENDERECO="${{ inputs.swf }}"
          NOME="${{ steps.abrir.outputs.nome }}"

          # SEM ENDERECO = O TESTE QUE INTERESSA.
          #
          # O aplicativo agora abre na tela de entrada, que e a pagina de
          # login do site mostrada aqui dentro. Passar --jogo PULA essa tela,
          # entao pra conferir se ela pinta o certo e nao passar nada.
          #
          # O campo do endereco continua existindo pra quando a pergunta for
          # outra ("este .swf toca?"), e ai vale o caminho antigo.
          #
          # ABRIR COM O CONSOLE LIGADO.
          #
          # Ja houve um caso de o aplicativo morrer por volta dos 40 segundos
          # sem deixar recado no registro do sistema. Falta de recado ali e
          # tipico de estouro do proprio programa: a mensagem sai pela saida
          # de texto, que so aparece com o console ligado.
          #
          # Roda em segundo plano porque o console prende o terminal ate o
          # aplicativo fechar — e a gente precisa fotografar nesse meio tempo.
          if [ -z "$ENDERECO" ]; then
            echo "abrindo SEM endereco: a tela de entrada deve aparecer"
            xcrun simctl launch --console-pty "$ID" "$NOME" \
              > fotos/o-que-o-app-disse.txt 2>&1 &
          else
            echo "abrindo com: $ENDERECO"
            xcrun simctl launch --console-pty "$ID" "$NOME" --jogo "$ENDERECO" \
              > fotos/o-que-o-app-disse.txt 2>&1 &
          fi
          sleep 5
          xcrun simctl io "$ID" screenshot "fotos/1-abriu.png" || true
          exit 0

      # Uma foto a cada 10 segundos, por dois minutos. O jogo demora, e uma
      # tela preta no segundo 10 nao quer dizer nada.
      - name: Acompanhar por dois minutos
        run: |
          for i in $(seq -w 1 12); do
            sleep 10
            xcrun simctl io "${{ steps.telefone.outputs.id }}" screenshot "fotos/tela-$i.png" || true
            echo "foto $i (segundo $((10#$i * 10)))"
          done
          ls -lh fotos
          echo ""
          echo "=================== O QUE O APLICATIVO DISSE =================="
          cat fotos/o-que-o-app-disse.txt 2>/dev/null | tail -60

      # RELATORIO DE FALHA.
      #
      # Quando o aplicativo fecha sozinho, o registro comum nao diz nada — ele
      # simplesmente para. O motivo fica num relatorio que o sistema escreve a
      # parte, com a linha exata onde quebrou. Sem isso a gente fica olhando
      # pra tela de inicio do iPhone sem saber por que chegou ali.
      - name: Procurar relatorio de falha
        if: always()
        run: |
          mkdir -p fotos
          echo "--- relatorios encontrados:"
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null || echo "(nenhum)"
          # Procura em todo lugar onde relatorio de falha costuma cair, e
          # nao so na pasta principal — no simulador ele as vezes vai parar
          # dentro da pasta do proprio aparelho.
          find ~/Library/Logs ~/Library/Developer/CoreSimulator             -name "*.ips" -mmin -15 2>/dev/null | while read -r arquivo; do
            echo "copiando $arquivo"
            cp "$arquivo" fotos/ 2>/dev/null || true
          done
          # O trecho que interessa costuma ser o comeco: motivo e pilha.
          for arquivo in fotos/*uffle*; do
            [ -e "$arquivo" ] || continue
            echo "================ $arquivo"
            head -60 "$arquivo"
          done

      # Se o aplicativo tiver morrido ou reclamado, o motivo esta aqui.
      - name: Guardar o que o aplicativo falou
        if: always()
        run: |
          mkdir -p fotos
          xcrun simctl spawn "${{ steps.telefone.outputs.id }}" log show \
            --last 3m --predicate 'processImagePath contains "ruffle"' \
            > fotos/registro-do-aplicativo.txt 2>&1 || true
          tail -60 fotos/registro-do-aplicativo.txt || true

      - name: Guardar as fotos pra baixar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fotos-do-simulador
          path: fotos/
