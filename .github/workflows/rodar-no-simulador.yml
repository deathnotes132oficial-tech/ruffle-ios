# Abre o aplicativo num iPhone simulado, manda ele abrir um Flash, e
# fotografa a tela.
#
# POR QUE ISTO EXISTE
# -------------------
# O montar.yml respondeu "compila?". A primeira versao disto respondeu
# "abre?" — e a resposta foi sim: apareceu a tela do Ruffle, de pe por 30
# segundos.
#
# Agora falta a pergunta seguinte: ele DESENHA FLASH, ou so tem a casca?
# Entao a gente poe um arquivo .swf na maquina e manda o aplicativo abrir.
#
# O QUE ISTO NAO RESPONDE
# -----------------------
# Velocidade. O simulador usa o processador do Mac deles, muito mais forte
# que o de um iPhone. Serve pra saber se FUNCIONA, nunca se e rapido. Essa
# resposta so vem no aparelho de verdade, pelo TestFlight.

name: Rodar no simulador

on:
  workflow_dispatch:
    inputs:
      swf:
        description: "Endereco de um .swf pra testar (em branco = o padrao)"
        required: false
        default: ""

jobs:
  simulador:
    runs-on: macos-latest

    steps:
      - name: Pegar o codigo
        uses: actions/checkout@v4

      # SEM mandar trocar de versao do Rust.
      #
      # O projeto tem um rust-toolchain.toml que fixa a versao que ele quer.
      # Numa tentativa anterior eu mandei usar a estavel, e o alvo do simulador
      # foi instalado na versao errada. Rodando DENTRO da pasta do projeto, o
      # rustup respeita o arquivo dele sozinho.
      - name: Instalar o alvo de simulador
        run: |
          rustup show
          rustup target add aarch64-apple-ios-sim
          rustup target list --installed

      - name: Descobrir o nome do projeto
        id: achar
        run: |
          set -e
          PROJETO=$(ls -d *.xcodeproj | head -1)
          ESQUEMA=$(xcodebuild -list -project "$PROJETO" -json \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['project']['schemes'][0])")
          echo "projeto=$PROJETO" >> $GITHUB_OUTPUT
          echo "esquema=$ESQUEMA" >> $GITHUB_OUTPUT
          echo "projeto: $PROJETO / esquema: $ESQUEMA"

      # ARCHS=arm64 existe porque por padrao ele tenta montar um aplicativo que
      # sirva em simulador Intel E Apple ao mesmo tempo. O pedaco Intel nem
      # existe no Rust com esse nome, e a maquina do GitHub e Apple.
      - name: Compilar para o simulador
        run: |
          set -o pipefail
          xcodebuild \
            -project "${{ steps.achar.outputs.projeto }}" \
            -scheme "${{ steps.achar.outputs.esquema }}" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath construcao \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build

      # USAR UM IPHONE QUE JA EXISTE, em vez de criar.
      #
      # Criar escolhendo "o ultimo da lista" saiu um iPhone 6s Plus, que nao
      # roda iOS 26 — "Incompatible device". Os que ja vem na maquina sao
      # compativeis com o Xcode dela.
      - name: Ligar um iPhone simulado
        id: telefone
        run: |
          set -e
          echo "--- aparelhos prontos nesta maquina:"
          xcrun simctl list devices available | grep -i iphone || true
          ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for v in d.values() for x in v if 'iPhone' in x['name']]; print(c[-1]['udid'] if c else '')")
          NOME=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for v in d.values() for x in v if 'iPhone' in x['name']]; print(c[-1]['name'] if c else '')")
          if [ -z "$ID" ]; then
            echo "Nenhum iPhone pronto. Nao da pra seguir."
            exit 1
          fi
          echo "usando: $NOME ($ID)"
          xcrun simctl boot "$ID" || true
          xcrun simctl bootstatus "$ID" -b
          echo "id=$ID" >> $GITHUB_OUTPUT

      - name: Instalar e abrir o aplicativo
        id: abrir
        run: |
          set -e
          APLICATIVO=$(find construcao/Build/Products -maxdepth 3 -name '*.app' | head -1)
          echo "aplicativo: $APLICATIVO"
          NOME=$(defaults read "$PWD/$APLICATIVO/Info" CFBundleIdentifier)
          echo "identificador: $NOME"
          xcrun simctl install "${{ steps.telefone.outputs.id }}" "$APLICATIVO"
          xcrun simctl launch "${{ steps.telefone.outputs.id }}" "$NOME"
          sleep 5
          mkdir -p fotos
          xcrun simctl io "${{ steps.telefone.outputs.id }}" screenshot "fotos/1-abriu.png" || true
          echo "nome=$NOME" >> $GITHUB_OUTPUT

      - name: Buscar um Flash pra testar
        id: arquivo
        run: |
          set -e
          ENDERECO="${{ inputs.swf }}"
          if [ -z "$ENDERECO" ]; then
            # Um dos arquivos de teste do proprio Ruffle: pequeno e estavel.
            ENDERECO="https://raw.githubusercontent.com/ruffle-rs/ruffle/master/tests/tests/swfs/avm2/hello_world/test.swf"
          fi
          echo "baixando: $ENDERECO"
          curl -fsSL "$ENDERECO" -o teste.swf
          ls -lh teste.swf
          file teste.swf
          echo "caminho=$PWD/teste.swf" >> $GITHUB_OUTPUT

      # UMA tentativa so, e depois OLHAR POR DOIS MINUTOS.
      #
      # Antes eu fazia duas entregas e reiniciava o aplicativo no meio. As
      # duas funcionaram, entao a duvida acabou — e reiniciar agora seria um
      # tiro no pe: o DDTank leva mais de um minuto carregando, e reiniciar
      # mataria o carregamento na metade.
      - name: Mandar o aplicativo abrir o Flash
        run: |
          set +e
          ID="${{ steps.telefone.outputs.id }}"
          xcrun simctl openurl "$ID" "file://${{ steps.arquivo.outputs.caminho }}"
          echo "resultado da entrega: $?"
          exit 0

      # Uma foto a cada 10 segundos, por dois minutos. O jogo demora, e uma
      # tela preta no segundo 10 nao quer dizer nada.
      - name: Acompanhar por dois minutos
        run: |
          for i in $(seq -w 1 12); do
            sleep 10
            xcrun simctl io "${{ steps.telefone.outputs.id }}" screenshot "fotos/tela-$i.png" || true
            echo "foto $i (segundo $((10#$i * 10)))"
          done
          ls -lh fotos

      # Se o aplicativo tiver morrido ou reclamado, o motivo esta aqui.
      - name: Guardar o que o aplicativo falou
        if: always()
        run: |
          mkdir -p fotos
          xcrun simctl spawn "${{ steps.telefone.outputs.id }}" log show \
            --last 3m --predicate 'processImagePath contains "ruffle"' \
            > fotos/registro-do-aplicativo.txt 2>&1 || true
          tail -60 fotos/registro-do-aplicativo.txt || true

      - name: Guardar as fotos pra baixar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fotos-do-simulador
          path: fotos/
