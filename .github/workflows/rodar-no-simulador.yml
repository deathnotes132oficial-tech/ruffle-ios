# Abre o aplicativo num iPhone simulado e fotografa a tela.
#
# POR QUE ISTO EXISTE
# -------------------
# O montar.yml respondeu "compila?". Isto aqui responde a pergunta seguinte:
# "abre e mostra alguma coisa?". E a gente descobre sem ter Mac nem iPhone,
# porque quem roda o simulador e a maquina do GitHub.
#
# O QUE ISTO NAO RESPONDE
# -----------------------
# Velocidade. O simulador usa o processador do Mac deles, que e muito mais
# forte que o de um iPhone. Entao serve pra saber se o aplicativo FUNCIONA,
# nunca pra saber se ele e rapido. Essa resposta so vem no aparelho de
# verdade, pelo TestFlight.

name: Rodar no simulador

on:
  workflow_dispatch:

jobs:
  simulador:
    runs-on: macos-latest

    steps:
      - name: Pegar o codigo
        uses: actions/checkout@v4

      # SEM mandar trocar de versao do Rust.
      #
      # O projeto tem um rust-toolchain.toml que fixa a versao que ele quer
      # (nightly). Na primeira tentativa eu mandei usar a estavel, e o alvo do
      # simulador foi instalado na versao errada — a compilacao usou uma e o
      # alvo estava na outra. Rodando DENTRO da pasta do projeto, o rustup
      # respeita o arquivo dele sozinho.
      - name: Instalar o alvo de simulador
        run: |
          rustup show
          rustup target add aarch64-apple-ios-sim
          rustup target list --installed

      - name: Descobrir o nome do projeto
        id: achar
        run: |
          set -e
          PROJETO=$(ls -d *.xcodeproj | head -1)
          ESQUEMA=$(xcodebuild -list -project "$PROJETO" -json \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['project']['schemes'][0])")
          echo "projeto=$PROJETO" >> $GITHUB_OUTPUT
          echo "esquema=$ESQUEMA" >> $GITHUB_OUTPUT
          echo "projeto: $PROJETO / esquema: $ESQUEMA"

      # Compilacao pro SIMULADOR e diferente da do aparelho: outro processador
      # de destino, e sem precisar de assinatura nenhuma.
      #
      # ARCHS=arm64 existe porque por padrao ele tenta montar um aplicativo que
      # sirva em simulador Intel E Apple ao mesmo tempo. O pedaco Intel nem
      # existe no Rust com esse nome (foi o erro da primeira tentativa), e a
      # maquina do GitHub e Apple — entao seria trabalho pra produzir algo que
      # ninguem usaria.
      - name: Compilar para o simulador
        run: |
          set -o pipefail
          xcodebuild \
            -project "${{ steps.achar.outputs.projeto }}" \
            -scheme "${{ steps.achar.outputs.esquema }}" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath construcao \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build

      # USAR UM QUE JA EXISTE, em vez de criar.
      #
      # Na tentativa anterior eu criava um aparelho pegando o ULTIMO da lista,
      # supondo que fosse o mais novo. Nao e: a lista nao esta em ordem de
      # lancamento, e saiu um iPhone 6s Plus, que nao roda iOS 26 —
      # "Incompatible device".
      #
      # A maquina do GitHub ja vem com iPhones simulados prontos e compativeis
      # com o Xcode dela. Usar um desses acaba com a adivinhacao.
      - name: Ligar um iPhone simulado
        id: telefone
        run: |
          set -e
          echo "--- aparelhos prontos nesta maquina:"
          xcrun simctl list devices available | grep -i iphone || true
          ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for v in d.values() for x in v if 'iPhone' in x['name']]; print(c[-1]['udid'] if c else '')")
          NOME=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for v in d.values() for x in v if 'iPhone' in x['name']]; print(c[-1]['name'] if c else '')")
          if [ -z "$ID" ]; then
            echo "Nenhum iPhone pronto. Nao da pra seguir."
            exit 1
          fi
          echo "usando: $NOME ($ID)"
          xcrun simctl boot "$ID" || true
          xcrun simctl bootstatus "$ID" -b
          echo "id=$ID" >> $GITHUB_OUTPUT

      - name: Instalar e abrir o aplicativo
        id: abrir
        run: |
          set -e
          APLICATIVO=$(find construcao/Build/Products -maxdepth 3 -name '*.app' | head -1)
          echo "aplicativo: $APLICATIVO"
          NOME=$(defaults read "$PWD/$APLICATIVO/Info" CFBundleIdentifier)
          echo "identificador: $NOME"
          xcrun simctl install "${{ steps.telefone.outputs.id }}" "$APLICATIVO"
          xcrun simctl launch "${{ steps.telefone.outputs.id }}" "$NOME"
          echo "nome=$NOME" >> $GITHUB_OUTPUT

      # Varias fotos ao longo do tempo, e nao uma: uma tela preta no segundo 2
      # nao quer dizer nada, e uma tela preta no segundo 30 quer dizer muito.
      - name: Fotografar a tela ao longo de 30 segundos
        run: |
          mkdir -p fotos
          for i in 1 2 3 4 5 6; do
            sleep 5
            xcrun simctl io "${{ steps.telefone.outputs.id }}" screenshot "fotos/tela-$i.png" || true
            echo "foto $i tirada"
          done
          ls -lh fotos

      # Se o aplicativo tiver morrido, o motivo esta aqui.
      - name: Guardar o que o aplicativo falou
        if: always()
        run: |
          mkdir -p fotos
          xcrun simctl spawn "${{ steps.telefone.outputs.id }}" log show \
            --last 2m --predicate 'processImagePath contains "ruffle"' \
            > fotos/registro-do-aplicativo.txt 2>&1 || true
          tail -40 fotos/registro-do-aplicativo.txt || true

      - name: Guardar as fotos pra baixar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fotos-do-simulador
          path: fotos/
