# Tocar no "Exemplo" num iPad, como o revisor da Apple (16/11).
#
# A build 53 foi recusada (2.1a): no iPad Air 11" M3, iPadOS 27.2.1, tocar em
# "Exemplo" fechava o app — nas duas aberturas. O teste de interface em
# .github/tocar-exemplo faz o mesmo: instala limpo, abre, toca, espera 30s;
# fecha, abre de novo, toca de novo. Nao precisa de conta nem de senha.

name: Tocar no Exemplo

on:
  push:
    branches: ['teste-exemplo-*']

jobs:
  testar:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Pegar o codigo
        uses: actions/checkout@v4

      - name: Usar o Xcode mais novo da maquina
        run: |
          ls -d /Applications/Xcode*.app
          NOVO=$(ls -d /Applications/Xcode_[0-9]*.app | sort -V | tail -1)
          [ -n "$NOVO" ] && sudo xcode-select -s "$NOVO"
          xcodebuild -version

      - name: Instalar o alvo de simulador
        run: |
          rustup show
          rustup target add aarch64-apple-ios-sim

      - name: Descobrir o nome do projeto
        id: achar
        run: |
          set -e
          PROJETO=$(ls -d *.xcodeproj | head -1)
          ESQUEMA=$(xcodebuild -list -project "$PROJETO" -json \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['project']['schemes'][0])")
          echo "projeto=$PROJETO" >> $GITHUB_OUTPUT
          echo "esquema=$ESQUEMA" >> $GITHUB_OUTPUT

      # Igual ao "Rodar no simulador", de proposito: medir outra compilacao
      # seria medir outra coisa.
      - name: Compilar para o simulador
        run: |
          set -o pipefail
          xcodebuild \
            -project "${{ steps.achar.outputs.projeto }}" \
            -scheme "${{ steps.achar.outputs.esquema }}" \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath construcao \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            INFOPLIST_KEY_CFBundleDisplayName="CF Client" \
            INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone="UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight" \
            INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad="UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight" \
            INFOPLIST_KEY_UIRequiresFullScreen=YES \
            build

      - name: Ligar o iPad simulado
        id: telefone
        run: |
          set -e
          export ESCOLHA="iPad Air 11-inch (M3)"
          xcrun simctl list devices available -j > /tmp/aparelhos.json
          # O iOS MAIS NOVO QUE A MAQUINA TIVER: o revisor estava no 27.2.1.
          ESCOLHER='import json,re,sys; d=json.load(open("/tmp/aparelhos.json"))["devices"]; v=lambda k: [int(n) for n in re.findall(r"[0-9]+", k.split("iOS-")[-1])]; ks=sorted([k for k in d if "iOS-" in k and any(e in x["name"] for x in d[k] for e in [__import__("os").environ["ESCOLHA"]])], key=v); c=[x for x in d[ks[-1]] if __import__("os").environ["ESCOLHA"] in x["name"]] if ks else []; print((ks[-1] if sys.argv[1]=="rt" else c[-1][sys.argv[1]]) if c else "")'
          echo "runtimes: $(xcrun simctl list runtimes | grep -i ios | paste -sd ';' -)"
          echo "iOS do teste: $(python3 -c "$ESCOLHER" rt)"
          ID=$(python3 -c "$ESCOLHER" udid)
          NOME=$(python3 -c "$ESCOLHER" name)
          [ -n "$ID" ] || { echo "Nenhum $ESCOLHA pronto."; exit 1; }
          echo "usando: $NOME ($ID)"
          xcrun simctl boot "$ID" || true
          xcrun simctl bootstatus "$ID" -b
          echo "id=$ID" >> $GITHUB_OUTPUT

      - name: Instalar o aplicativo (limpo)
        id: abrir
        run: |
          set -e
          APLICATIVO=$(find construcao/Build/Products -maxdepth 3 -name '*.app' | head -1)
          NOME=$(defaults read "$PWD/$APLICATIVO/Info" CFBundleIdentifier)
          xcrun simctl uninstall "${{ steps.telefone.outputs.id }}" "$NOME" 2>/dev/null || true
          xcrun simctl install "${{ steps.telefone.outputs.id }}" "$APLICATIVO"
          echo "nome=$NOME" >> $GITHUB_OUTPUT

      - name: Montar o projeto do teste
        run: |
          brew install xcodegen >/dev/null
          cd .github/tocar-exemplo && xcodegen generate

      - name: Tocar no Exemplo, duas aberturas
        env:
          TEST_RUNNER_APP: ${{ steps.abrir.outputs.nome }}
          ID: ${{ steps.telefone.outputs.id }}
        run: |
          mkdir -p fotos
          set +e
          xcodebuild test \
            -project .github/tocar-exemplo/TocarExemplo.xcodeproj \
            -scheme Testes \
            -destination "id=$ID" \
            -resultBundlePath resultado.xcresult \
            2>&1 | tee fotos/teste.txt \
            | grep -E 'PASSO:|error|failed|passed|Test Case|XCTAssert'
          RC=${PIPESTATUS[0]}
          mkdir -p fotos/passos
          xcrun xcresulttool export attachments --path resultado.xcresult --output-path fotos/passos >/dev/null 2>&1 || true
          cp ~/Library/Logs/DiagnosticReports/*ruffle* fotos/ 2>/dev/null || true
          ls fotos
          if [ $RC = 0 ]; then
            echo "RESULTADO: TOCOU NO EXEMPLO E NAO FECHOU"
          else
            echo "RESULTADO: FECHOU AO TOCAR NO EXEMPLO (ou o teste nao chegou la)"
            exit 1
          fi

      - name: Guardar o resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tocar-exemplo
          path: fotos/
          retention-days: 1
